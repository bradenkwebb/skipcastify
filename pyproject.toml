[project]
name = "skipcastify"
version = "0.1.0"
description = "A tool for removing ads from podcasts"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "feedgen>=1.0.0",
    "feedparser>=6.0.11",
    "flask>=3.0.3",
    "pyaml>=25.1.0",
    "pydub>=0.25.1",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.4",
    "openai-whisper>=20231117",
    "pillow>=10.4.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.5",
]

[project.scripts]
serve = "skipcastify.server"
pipeline = "skipcastify.pipeline"
