name: docker
# Builds the image (no push) when the packaging could break, so the Docker
# install doesn't rot while day-to-day work uses uv + systemd.
on:
  pull_request:
    paths: [Dockerfile, .dockerignore, docker-compose.yml, pyproject.toml, uv.lock]
  push:
    branches: [dev, main]
    paths: [Dockerfile, .dockerignore, docker-compose.yml, pyproject.toml, uv.lock]
  # Weekly too: a code-only change (e.g. importing from a .dockerignore'd dir)
  # can break the image without touching the paths above.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t skipcastify .
      - name: Docker import smoke test
        run: |
          docker run --rm skipcastify python -c "import server, pipeline"
          touch .env && docker compose config -q
      - name: Server starts and requires login
        run: |
          docker run -d --name sk -p 5000:5000 -e FEED_USERNAME=ci -e FEED_PASSWORD=ci skipcastify
          for i in $(seq 30); do
            # || true: the step runs under bash -e, and curl fails until gunicorn listens.
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/settings || true)
            [ "$code" = 401 ] && exit 0
            sleep 1
          done
          echo "expected 401 from /settings, got $code"; docker logs sk; exit 1
