name: ios
# Only for changes under ios/, and not a required check, so it never blocks
# server-only PRs. Signing is off: CI has no Local.xcconfig.
on:
  pull_request:
    paths: [ios/**, .github/workflows/ios.yml]
  push:
    branches: [dev, main]
    paths: [ios/**, .github/workflows/ios.yml]
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Package tests
        run: swift test --package-path ios/Packages/SkipcastifyKit
      - name: Build the app for the simulator
        run: |
          xcodebuild -project ios/Skipcastify.xcodeproj -scheme Skipcastify \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -5
          test "${PIPESTATUS[0]}" -eq 0
