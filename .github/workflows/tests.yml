name: tests
on:
  pull_request:
  push:
    branches: [dev, main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      # Paid LLM tests are skipped unless --run-llm is passed.
      - run: uv run pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - run: uv run ruff check .
